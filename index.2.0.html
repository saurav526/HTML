<!DOCTYPE html>
<html>
<head>
    <title>HTML Important Tags Demo</title>
</head>

<body>

    <!-- Headings -->
    <h1>Welcome to HTML</h1>
    <h2>Basic HTML Tags</h2>
    <h3>This is Heading 3</h3>

    <!-- Paragraph -->
    <p>
        HTML stands for HyperText Markup Language.
        It is used to create web pages.
    </p>

    <!-- Link -->
    <a href="https://github.com/saurav526" target="_blank">
        Visit GitHub Profile
    </a>

    <br><br>

    <!-- Image -->
    <img src="https://github.com/saurav526.png" alt="Sample Image">
    <br><br>

    <!-- Div and Span -->
    <div style="border:1px solid black; padding:10px;">
        This is a div container.
        <span style="color:red;">This is span text</span>
    </div>

    <br>

    <!-- Form -->
    <h2>Student Form</h2>
    <form>
        <label>Name:</label>
        <input type="text" placeholder="Enter your name">
        <br><br>

        <label>Email:</label>
        <input type="email" placeholder="Enter your email">
        <br><br>

        <button type="submit">Submit</button>
    </form>

    <br><br>

    <!-- Table -->
    <h2>Student Marks Table</h2>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>Math</td>
            <td>85</td>
        </tr>
        <tr>
            <td>Anita</td>
            <td>Science</td>
            <td>90</td>
        </tr>
    </table>

</body>
</html>
